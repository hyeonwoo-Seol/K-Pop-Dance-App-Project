# 워크플로우 명칭: AI Server 전용 CI임을 명시
name: Python AI Server CI

on:
  push:
    branches: [ "main" ]
    # 중요: 'ai-server' 폴더 내부가 변경될 때만 이 워크플로우를 실행
    paths:
      - 'ai-server/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ai-server/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    # [핵심 설정] 모든 run 명령어의 실행 위치를 'ai-server' 폴더로 지정
    defaults:
      run:
        working-directory: ./ai-server

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # ai-server 폴더 내의 requirements.txt를 찾아 설치
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # 문법 오류 및 치명적인 에러 검사
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # PEP8 스타일 가이드 준수 여부 검사 (경고 처리)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        # ai-server 폴더 내의 테스트 코드 실행
        pytest
