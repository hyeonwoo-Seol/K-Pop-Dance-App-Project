name: Android CI

on:
  push:
    branches: [ "main" ]
    # 앱 폴더 내 변경 사항이 있을 때만 실행
    paths:
      - 'kpop-android-app/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'kpop-android-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    # [핵심] 모든 명령어를 안드로이드 앱 폴더 내에서 실행
    defaults:
      run:
        working-directory: ./kpop-android-app

    steps:
    - uses: actions/checkout@v4
    
    # Kotlin 빌드를 위해서도 JDK 설정은 필수입니다.
    # 안드로이드 최신 빌드 툴은 보통 JDK 17을 요구합니다.
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Gradle 실행 권한 부여 (리눅스 환경에서 필수)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 전체 빌드 수행
    - name: Build with Gradle
      run: ./gradlew build
      
    # (선택 사항) 유닛 테스트 실행
    - name: Run Unit Tests
      run: ./gradlew test
